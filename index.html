<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basil Woods School</title>

  <!--
    ╔══════════════════════════════════════════════════════════╗
    ║  DYNAMIC QR REDIRECT — Basil Woods School               ║
    ║                                                          ║
    ║  To change where the QR code sends people,               ║

    ╚══════════════════════════════════════════════════════════╝

  <meta http-equiv="refresh" content="0; url=https://basilwoodsschool.com">

  <!-- Fallback page if redirect doesn't work -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a5e1f 0%, #2d8a34 100%);
      color: white; text-align: center; padding: 2rem;
    }
    .card {
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      border-radius: 1rem; padding: 2.5rem; max-width: 400px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p { opacity: 0.85; margin-bottom: 1.5rem; }
    a {
      display: inline-block; padding: 0.75rem 2rem;
      background: white; color: #1a5e1f;
      border-radius: 0.5rem; text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🌳 Basil Woods School</h1>
    <p>Redirecting you now…</p>
    <a href="https://basilwoodsschool.com">Tap here if not redirected</a>
  </div>
</body>
</html>
