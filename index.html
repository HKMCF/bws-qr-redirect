<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basil Woods School</title>

  <!--
    ╔══════════════════════════════════════════════════════════╗
    ║  DYNAMIC QR REDIRECT — Basil Woods School               ║
    ║                                                          ║
    ║  To change where the QR code sends people,               ║
    ║  edit the DESTINATION_URL below.                         ║
    ║                                                          ║
    ║  To change the GA4 tracking ID,                          ║
    ║  edit the GA_MEASUREMENT_ID below.                       ║
    ╚══════════════════════════════════════════════════════════╝
  -->

  <!-- ▼▼▼ EDIT THESE TWO VALUES ▼▼▼ -->
  <script>
    var DESTINATION_URL = "https://basilwoodsschool.com";
    var GA_MEASUREMENT_ID = "G-XXXXXXXXXX"; // ← Replace with your real ID
  </script>
  <!-- ▲▲▲ EDIT THESE TWO VALUES ▲▲▲ -->

  <!-- Google Analytics 4 -->
  <script>
    // Load gtag.js asynchronously
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_MEASUREMENT_ID;
    document.head.appendChild(s);

    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', GA_MEASUREMENT_ID, { send_page_view: true });

    // Send the page_view event, then redirect after a brief delay
    // (the delay ensures GA has time to fire the beacon)
    gtag('event', 'qr_scan', {
      event_category: 'flyer',
      event_label: 'bws_qr_redirect'
    });

    // Redirect after 800ms (enough for GA beacon to fire)
    setTimeout(function() {
      window.location.replace(DESTINATION_URL);
    }, 800);
  </script>

  <!-- Fallback redirect if JS is disabled (instant, no tracking) -->
  <noscript>
    <meta http-equiv="refresh" content="0; url=https://basilwoodsschool.com">
  </noscript>

  <!-- Fallback page shown during the brief delay -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a5e1f 0%, #2d8a34 100%);
      color: white; text-align: center; padding: 2rem;
    }
    .card {
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      border-radius: 1rem; padding: 2.5rem; max-width: 400px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p { opacity: 0.85; margin-bottom: 1.5rem; }
    .spinner {
      width: 24px; height: 24px; border: 3px solid rgba(255,255,255,0.3);
      border-top-color: white; border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    a {
      display: inline-block; padding: 0.75rem 2rem;
      background: white; color: #1a5e1f;
      border-radius: 0.5rem; text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🌳 Basil Woods School</h1>
    <div class="spinner"></div>
    <p>Redirecting you now…</p>
    <a id="fallback-link" href="https://basilwoodsschool.com">Tap here if not redirected</a>
    <script>
      // Update fallback link to match the configured destination
      document.getElementById('fallback-link').href = DESTINATION_URL;
    </script>
  </div>
</body>
</html>
